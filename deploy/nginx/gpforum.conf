upstream gpforum_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Port 80 exists only to redirect and to answer the ACME challenge. The
# application sets Secure on its session cookie in staging and production
# (GPForum::Bootstrap::Security, driven by requires_secure_transport), so a
# browser will not send that cookie back over plain HTTP: served on 80 alone,
# nobody can stay logged in.
server {
    listen 80;
    listen [::]:80;
    server_name forum.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forum.example.com;

    # Replace with the paths your ACME client writes. certbot's default is
    # /etc/letsencrypt/live/<name>/.
    ssl_certificate     /etc/letsencrypt/live/forum.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GPForumTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is set by the application, through
    # GPForum::Security::BrowserHeaders, so it is deliberately not repeated
    # here: two Strict-Transport-Security headers is a misconfiguration.

    client_max_body_size 20m;

    # Repo tree is assets/. /gpforum-ssr.css still reaches Hypnotoad
    # via location / (Mojolicious static roots).
    location /assets/ {
        root /opt/gpforum;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Public download route must reach the app. Do not make /attachments/
    # internal — that prefix is /attachments/:id/download.
    location ~ ^/attachments/[^/]+/download$ {
        proxy_pass http://gpforum_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # Internal alias for X-Accel-Redirect after the app authorizes.
    # Point X-Accel-Redirect at /internal-attachments/<object_key>.
    # Alias root must match the attachment store root (default
    # var/attachments, or an operator path such as /srv/gpforum/attachments).
    location /internal-attachments/ {
        internal;
        alias /srv/gpforum/attachments/;
    }

    location = /metrics {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://gpforum_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://gpforum_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
