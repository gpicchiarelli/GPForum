<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  width="620"
  height="180"
  viewBox="0 0 620 180"
  version="1.1"
  id="gpforum-logo-source"
  sodipodi:docname="gpforum-logo-source.svg"
  inkscape:version="1.3">
  <title>GPForum Logo Source</title>
  <desc>Editable source artwork for the GPForum mark and horizontal logo.</desc>
  <defs id="defs">
    <linearGradient id="brand-bg" x1="12" y1="10" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111412"/>
      <stop offset="0.58" stop-color="#214237"/>
      <stop offset="1" stop-color="#3f5f72"/>
    </linearGradient>
    <linearGradient id="brand-warm" x1="24" y1="18" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f6ef"/>
      <stop offset="1" stop-color="#c9835a"/>
    </linearGradient>
    <style id="brand-style">
      .ink { fill: #111412; }
      .paper { fill: #f8f6ef; }
      .forest { fill: #214237; }
      .moss { fill: #63735f; }
      .copper { fill: #a6532f; }
      .clay { fill: #c9835a; }
      .steel { fill: #3f5f72; }
      .line-paper { stroke: #f8f6ef; }
      .line-clay { stroke: #c9835a; }
      .round-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <sodipodi:namedview
    id="namedview"
    pagecolor="#ffffff"
    bordercolor="#111412"
    borderopacity="0.24"
    inkscape:showpageshadow="0"
    inkscape:pageopacity="1"
    inkscape:pagecheckerboard="0"
    inkscape:deskcolor="#f8f6ef"/>
  <g id="palette" inkscape:label="Palette">
    <rect x="16" y="144" width="24" height="24" rx="4" fill="#111412"/>
    <rect x="48" y="144" width="24" height="24" rx="4" fill="#214237"/>
    <rect x="80" y="144" width="24" height="24" rx="4" fill="#3f5f72"/>
    <rect x="112" y="144" width="24" height="24" rx="4" fill="#63735f"/>
    <rect x="144" y="144" width="24" height="24" rx="4" fill="#a6532f"/>
    <rect x="176" y="144" width="24" height="24" rx="4" fill="#c9835a"/>
    <rect x="208" y="144" width="24" height="24" rx="4" fill="#f8f6ef" stroke="#d7d0c0"/>
  </g>
  <g id="logo-export" inkscape:label="Logo export" inkscape:groupmode="layer">
    <g id="mark" inkscape:label="Mark">
      <g id="mark-background" inkscape:label="Mark background">
        <rect x="16" y="16" width="96" height="96" rx="8" fill="url(#brand-bg)"/>
        <rect x="24" y="24" width="80" height="80" rx="6" fill="none" stroke="#f8f6ef" stroke-opacity="0.68" stroke-width="2"/>
      </g>
      <g id="network-map" inkscape:label="Network map">
        <path class="round-line line-paper" d="M40 67c13.2-15.1 34-15.5 49.5-2.5" stroke-opacity="0.72" stroke-width="3"/>
        <path class="round-line line-paper" d="M40 67c9.4 10.1 35.4 10.8 49.5-2.5" stroke-opacity="0.38" stroke-width="2.2"/>
        <path class="round-line line-paper" d="M49.8 48.5c6.3 10.8 6.5 29.4 0.7 37" stroke-opacity="0.32" stroke-width="1.8"/>
        <path class="round-line line-paper" d="M79.7 48.5c-6.3 10.8-6.5 29.4-0.7 37" stroke-opacity="0.32" stroke-width="1.8"/>
        <path class="round-line line-paper" d="M36.5 67h56" stroke-opacity="0.28" stroke-width="1.5"/>
        <path class="round-line line-clay" d="M40 53.6c18.1-8.4 36-8.2 49.5 0" stroke-opacity="0.68" stroke-width="2.2"/>
        <path class="round-line line-clay" d="M40 80.6c16.3 7.9 34.7 8.1 49.5 0" stroke-opacity="0.52" stroke-width="2"/>
        <circle class="paper" cx="40" cy="67" r="3.8"/>
        <circle class="paper" cx="58" cy="51.4" r="3.2"/>
        <circle class="paper" cx="74" cy="84" r="3.2"/>
        <circle class="paper" cx="89.5" cy="64.5" r="3.8"/>
        <circle class="clay" cx="50.2" cy="83.4" r="2.5"/>
        <circle class="clay" cx="79.4" cy="50.2" r="2.5"/>
      </g>
      <g id="infrastructure-rails" inkscape:label="Infrastructure rails">
        <path class="round-line" d="M30 43h9" stroke="url(#brand-warm)" stroke-width="3"/>
        <path class="round-line" d="M30 53h9" stroke="url(#brand-warm)" stroke-width="3"/>
        <path class="round-line" d="M30 63h9" stroke="url(#brand-warm)" stroke-width="3"/>
        <path class="round-line" d="M30 73h9" stroke="url(#brand-warm)" stroke-width="3"/>
        <path class="round-line" d="M88 85h9" stroke="url(#brand-warm)" stroke-width="3"/>
        <path class="round-line" d="M88 75h9" stroke="url(#brand-warm)" stroke-width="3"/>
      </g>
      <g id="conversation-ribbon" inkscape:label="Conversation ribbon">
        <path class="paper" d="M50 94h24c5.3 0 9.6-3.8 9.6-8.5V84H59.6c-5.3 0-9.6 3.8-9.6 8.5V94Z"/>
        <path class="clay" d="M59.6 84h24l7.3-5.7v7.2c0 4.7-3.9 8.5-9 8.5H59.6V84Z" opacity="0.9"/>
      </g>
    </g>
    <g id="wordmark" inkscape:label="Wordmark">
      <text x="136" y="67" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="0" fill="#111412">GPForum</text>
      <text x="138" y="93" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#63735f">INDEPENDENT COMMUNITY INFRASTRUCTURE</text>
    </g>
  </g>
</svg>
