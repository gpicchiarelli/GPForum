name: Project Hygiene

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Required project files
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SUPPORT.md
          test -f GOVERNANCE.md
          test -f ROADMAP.md
          test -f CHANGELOG.md
          test -f docs/CPAN_LICENSE_REVIEW.md
          test -f docs/OPERATIONAL_BASELINE.md
          test -f docs/PERFORMANCE_BASELINE.md
          test -f docs/PERFORMANCE_EVIDENCE.md
          test -f docs/OBSERVABILITY.md
          test -f docs/OS_OPTIMIZATION.md
          test -f docs/OS_RUNTIME_ENFORCEMENT.md
          test -f docs/OS_RUNTIME_EVIDENCE.md
          test -f docs/DEPLOYMENT.md
          test -f docs/DEPLOYMENT_EVIDENCE.md
          test -f deploy/systemd/gpforum.service
          test -f deploy/freebsd/gpforum
          test -f deploy/launchd/com.gpforum.app.plist
          test -f deploy/nginx/gpforum.conf
          test -f deploy/caddy/Caddyfile
          test -f .github/workflows/ci.yml
          test -f .github/workflows/project-hygiene.yml
          test -f .github/workflows/postgres-matrix.yml
          test -f .github/workflows/platform-debian.yml
          test -f .github/workflows/platform-freebsd.yml
          test -f .github/workflows/platform-macos.yml
          test -f .github/workflows/security.yml
          test -f .github/workflows/deploy-units.yml
          test -f .github/workflows/ops-drills.yml
          test -f .github/workflows/performance.yml
          test -f .github/workflows/release.yml
          test -f .github/actions/setup-gpforum-perl/action.yml
          test -f .github/parameters/gha-install-macports.yaml
          test -f .gitleaks.toml
          test -f .shellcheckrc
          test -f etc/cpan-audit-ignore.txt
          test -f docs/CI.md
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .github/dependabot.yml
          test -f docs/adr/0000-template.md
          test -x script/bench-http
          test -x script/bench-hotpaths
          test -x script/bench-hypnotoad
          test -x script/bench-hypnotoad-scaling
          test -x script/cpan-license-check
          test -x script/gpforum-system-perl
          test -x script/perltidy-check
          test -x script/os-preflight
          test -x script/query-plan-check
          test -x script/query-plan-evidence
          test -x script/seed-benchmark
          test -x script/cpan-audit
          test -x script/gpforum-evidence-archive-check

      - name: No backup artifacts
        run: |
          ! find . -name '*.bak' -print | grep .

      - name: Prompt alignment marker
        run: |
          grep -q 'GitHub Project Success Contract' prompt/44.txt
          grep -q 'GitHub project success surface' README.md
