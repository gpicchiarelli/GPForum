name: Architecture decision
description: Request or document a deviation from the architecture contract.
title: "adr: "
labels:
  - architecture
  - adr
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What decision is required?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed Decision
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: Benefits, costs, risks, migration work, and rollback strategy.
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: Documentation or ADR reference
      description: Link to the documentation, ADR, or pull request that records the decision.
    validations:
      required: true
